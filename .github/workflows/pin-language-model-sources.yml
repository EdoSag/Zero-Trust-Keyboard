# Temporary: prints the hashes that language-models/sources.tsv and android/llm pin.
name: Pin language model sources
on:
  push:
    branches: [feature/keyboard-language-model]
    paths: [.github/workflows/pin-language-model-sources.yml]
permissions:
  contents: read
jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: llama.cpp release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/ggml-org/llama.cpp/releases?per_page=40" --jq '.[] | .tag_name + " " + .published_at' | sed -n '1,40p'
          TAG=$(gh api "repos/ggml-org/llama.cpp/releases?per_page=40" --jq '[.[] | select(.published_at < "2026-11-01")][0].tag_name')
          curl -sSfL -o llama.tar.gz "https://github.com/ggml-org/llama.cpp/archive/refs/tags/$TAG.tar.gz"
          echo "LLAMA TAG $TAG SHA256 $(sha256sum llama.tar.gz | cut -d' ' -f1)"
      - name: Qwen GGUF
        run: |
          set -euo pipefail
          curl -sSf https://huggingface.co/api/models/Qwen/Qwen2.5-0.5B-Instruct-GGUF | python3 -c "import json,sys;d=json.load(sys.stdin);print('QWEN COMMIT',d['sha']);print('TAGS',d.get('tags'))"
          curl -sSf https://huggingface.co/api/models/Qwen/Qwen2.5-0.5B-Instruct-GGUF/tree/main | python3 -c "
          import json,sys
          for f in json.load(sys.stdin):
              if f['path'].endswith('.gguf'): print('GGUF', f['path'], f['size'], f.get('lfs',{}).get('oid'))"
          curl -sSfL -o q.gguf https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          echo "Q4KM SHA256 $(sha256sum q.gguf | cut -d' ' -f1) BYTES $(stat -c %s q.gguf)"
          curl -sSfL https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/LICENSE | head -5
