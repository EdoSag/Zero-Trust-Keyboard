name: zerotrust_keyboard
description: "Zero-Trust Keyboard: a private keyboard. Everything you type stays on your phone."
publish_to: none
version: 0.10.2+21

environment:
  sdk: ^3.9.0

# Builds SQLite3MultipleCiphers instead of plain SQLite, so the core's local
# store is encrypted as a whole file (see Zero-Trust-Core README, "Sync").
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Shared account, keys, sync, settings and look of every Zero-Trust app.
  # Core main 0.12.0 (release merge, 2026-11-14). Switch to the v0.12.0 tag
  # once it is pushed. Never add cryptography_flutter: it breaks the core's
  # key derivation.
  zero_trust_core:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zero_trust_core
      # The core commit this app used before, plus the import-freeze fix of
      # Core PR #89 and #90. It lives on the Core branch
      # backport/import-freeze-fix-on-core-cd50d2d: keep that branch until
      # this pin moves to a core that has the fix.
      ref: bb408cc33ae6d113a1ee3da751ae2a4cef6166b2
  flutter_riverpod: ^3.5.0
  supabase_flutter: ^2.9.0
  # Hashes that stand for pinned clips in the list of what was synced.
  crypto: ^3.0.6
  # Random ids for synced items.
  uuid: ^4.5.0
  # Reset links from account emails (EmailLinks).
  app_links: ">=6.4.0 <8.0.0"
  flutter_dotenv: ^6.0.1
  intl: any
  url_launcher: ^6.3.1

dev_dependencies:
  # Release checks every Zero-Trust app runs in CI (keys, sync, sign-in, app
  # setup, database). Independent of zero_trust_core, so it may be newer.
  zt_release_checks:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_release_checks
      ref: 7f2a97d45120c21a148cb4fc67a95e3580e7a8a9
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
